name: Build DonutCore
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Unzip uploaded zip
        run: for z in *.zip; do if [ -f "$z" ]; then unzip -o "$z"; fi; done
      - name: Build plugin
        run: |
          cd "$(dirname "$(find . -name pom.xml -not -path '*/target/*' | head -1)")"
          mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: DonutCore-plugin
          path: '**/target/DonutCore.jar'
